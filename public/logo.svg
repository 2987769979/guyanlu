<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f857a6"/>
      <stop offset="100%" style="stop-color:#ff5858"/>
    </linearGradient>
    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- background -->
  <rect x="0" y="0" width="128" height="128" rx="12" ry="12" fill="url(#bg)"/>
  <!-- dice 1 - top left -->
  <g transform="translate(18, 20)">
    <rect x="0" y="0" width="42" height="42" rx="8" ry="8" fill="url(#dieGrad)" filter="url(#shadow)" stroke="#ddd" stroke-width="0.5"/>
    <circle cx="21" cy="21" r="4" fill="#f857a6"/>
  </g>
  <!-- dice 2 - top right -->
  <g transform="translate(68, 20)">
    <rect x="0" y="0" width="42" height="42" rx="8" ry="8" fill="url(#dieGrad)" filter="url(#shadow)" stroke="#ddd" stroke-width="0.5"/>
    <circle cx="11" cy="11" r="3.5" fill="#ff5858"/>
    <circle cx="31" cy="31" r="3.5" fill="#ff5858"/>
  </g>
  <!-- dice 3 - bottom left -->
  <g transform="translate(18, 68)">
    <rect x="0" y="0" width="42" height="42" rx="8" ry="8" fill="url(#dieGrad)" filter="url(#shadow)" stroke="#ddd" stroke-width="0.5"/>
    <circle cx="11" cy="11" r="3.5" fill="#f857a6"/>
    <circle cx="21" cy="21" r="3.5" fill="#f857a6"/>
    <circle cx="31" cy="31" r="3.5" fill="#f857a6"/>
  </g>
  <!-- dice 4 - bottom right -->
  <g transform="translate(68, 68)">
    <rect x="0" y="0" width="42" height="42" rx="8" ry="8" fill="url(#dieGrad)" filter="url(#shadow)" stroke="#ddd" stroke-width="0.5"/>
    <circle cx="11" cy="11" r="3.5" fill="#ff5858"/>
    <circle cx="31" cy="11" r="3.5" fill="#ff5858"/>
    <circle cx="11" cy="31" r="3.5" fill="#ff5858"/>
    <circle cx="31" cy="31" r="3.5" fill="#ff5858"/>
  </g>
</svg>
